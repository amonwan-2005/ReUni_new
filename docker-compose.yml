services:
  mysql:
    image: mysql:8.4
    container_name: reuni-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: reuni_root_change_me
      MYSQL_DATABASE: reuni
      MYSQL_USER: reuni_app
      MYSQL_PASSWORD: reuni_app_change_me
    ports:
      - "3306:3306"
    volumes:
      - reuni_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "reuni_app", "-preuni_app_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  reuni_mysql_data:
